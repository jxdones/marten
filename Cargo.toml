[package]
name = "marten-diff"
version = "0.1.7"
authors = ["Jones Dias"]
description = "A terminal diff viewer for reviewing your work before it becomes a commit or pull request."
keywords = ["tui", "terminal", "git", "diff", "review"]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/jxdones/marten"
homepage = "https://github.com/jxdones/marten"
readme = "README.md"
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[[bin]]
name = "marten"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
git2 = "0.21.0"
ratatui = "0.30.0"
serde = { version = "1.0.229", features = ["derive"] }
similar = { version = "3.1.1", features = ["unicode"] }
syntect = "5.2.0"
toml = "1.1.3"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.25.0"
